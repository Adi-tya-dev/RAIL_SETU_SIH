services:
  postgres:
    image: postgres:16
    container_name: railsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway_block_planning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway_block_planning"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: